function login(){return `<main class="login" id="main"><div class="login-brand"><div class="brand">${brand()}</div><h1 id="page-title" tabindex="-1">Gemeinsam lernen.<br>Sicher handeln.</h1><p>Ihre Plattform für polizeiliche Aus- und Fortbildung.</p></div><section class="login-card" aria-labelledby="login-title"><p class="eyebrow">Nordrhein-Westfalen</p><h2 id="login-title">Willkommen</h2><p class="muted">Melden Sie sich mit Ihrem Behördenkonto bei iBMS 3.0 an.</p><div class="field"><label for="organisation">Organisation</label><select id="organisation"><option>Polizei Nordrhein-Westfalen</option></select></div><a class="btn" href="#home">${icon('shield')}Mit Behördenkonto anmelden</a><div class="notice mt">${icon('help')}<span>Für den Entwurf öffnet dieser Button die Beispielansicht. Es werden keine Zugangsdaten abgefragt.</span></div><div class="login-footer"><button data-action="help-login">Hilfe zur Anmeldung</button><button data-action="accessibility">Barrierefreiheit</button><button data-action="privacy">Datenschutz</button></div><p class="login-note">Interaktiver Gestaltungsentwurf für LZPD NRW. Kein Produktivsystem.</p></section></main>`;}
function courseCard(c){return `<article class="panel course-card"><div class="course-art" role="img" aria-label="Abstraktes blaues Bildmotiv aus der Designvorlage"><span class="tag">${c.module}</span></div><div class="course-body"><div class="course-meta">${icon(c.type==='E-Learning'?'monitor':'calendar')}${c.type} · ${c.duration}</div><h3>${esc(c.title)}</h3><div class="course-meta">${icon('pin')}${c.place}</div><div class="course-meta">${c.type==='E-Learning'?'Ab '+formatDate(c.date):formatDate(c.date)} ${c.seats?`· ${c.seats} freie Plätze`:'· Ausgebucht'}</div>${link('Angebot ansehen','course/'+c.id,'textlink')}</div></article>`;}
function formatDate(d){return new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});}
function home(){return `<section class="hero"><div class="hero-copy"><p class="eyebrow">Nationale Kooperation POLIZEI-ONLINE</p><h1 id="page-title" tabindex="-1">Willkommen bei<br><strong>POLIZEI-ONLINE.</strong></h1><p>Finden Sie passende Angebote und behalten Sie Ihre nächsten Schritte im Blick.</p><form id="home-search" class="home-search"><label class="hidesr" for="home-q">Angebote suchen</label><input id="home-q" name="q" placeholder="Was möchten Sie lernen?" type="search"><button aria-label="Angebote suchen">${icon('search')}</button></form></div><div class="hero-art"><div class="hero-caption"><small>Fortbildung im Fokus</small><h3>Kompetenz entwickeln.<br>Wissen im Dienst anwenden.</h3>${link('Gesamtangebot entdecken','catalog','textlink')}</div></div></section><nav class="quicklinks" aria-label="Schnelleinstiege">${[['dashboard','grid','Mein iBMS','Termine und Nachweise'],['catalog','book','Gesamtangebot','Bildung, ET und Sport'],['lastminute','clock','Last Minute','Kurzfristig freie Plätze'],['learning','route','Mein Lernpfad','Die nächsten Schritte']].map(([r,i,h,d])=>`<a class="quick" href="#${r}"><span class="quick-icon">${icon(i)}</span><span><strong>${h}</strong><small>${d}</small></span></a>`).join('')}</nav><div class="sectionhead"><h2>Neue Perspektiven für Ihren Alltag</h2>${link('Alle Angebote','catalog','textlink')}</div><div class="grid three">${courses.slice(0,3).map(courseCard).join('')}</div><div class="grid two mt"><section class="panel"><div class="panel-head"><h2>Aktuelles aus der Fortbildung</h2></div><div class="newsrow"><time>16.09.2026</time><div><h3><a href="#article">Fortbildungsplanung gemeinsam gestalten</a></h3><p>Melden Sie Ihren Bedarf für das kommende Fortbildungsjahr.</p></div></div><div class="newsrow"><time>14.09.2026</time><div><h3><a href="#help">Gut ankommen in iBMS 3.0</a></h3><p>Antworten zu Registrierung, Nachweisen und persönlicher Übersicht.</p></div></div></section><section class="panel"><p class="eyebrow">Für Sie persönlich</p><h2>Ihr nächster Termin</h2><h3>Deeskalation im Einsatz</h3><p class="muted">15. Oktober · 09:00 Uhr<br>Fortbildungszentrum NRW</p>${link('Meine Registrierungen','dashboard','textlink')}</section></div>`;}
function eventRow(reg){const c=courses.find(c=>c.id===reg.course);return `<div class="event"><div class="date"><strong>${c.day}</strong><small>${c.month}</small></div><div class="event-main"><h3>${c.title}</h3><p>${c.time} · ${c.type}</p></div><div class="event-action">${badge(reg.status)}<button class="textlink" data-action="registration" data-id="${c.id}">Details ${icon('chevron')}</button></div></div>`;}
function stat(n,label,detail='',tone=''){return `<div class="stat"><h3>${label}</h3><span class="number ${tone}">${n}</span><p>${detail}</p></div>`;}
function dashboard(){const tabs=['Registrierungen','Bedarfsmeldungen','Fortbildungswünsche','Nachweise','Fertigkeiten'];let body='';if(state.mytab==='Registrierungen')body=`<div class="grid two"><section class="panel"><div class="panel-head"><h2>Meine nächsten Veranstaltungen</h2>${badge(state.registrations.length+' Einträge')}</div>${state.registrations.length?state.registrations.map(eventRow).join(''):'<p class="empty">Noch keine Registrierungen vorhanden.</p>'}</section><div class="grid"><section class="panel"><p class="eyebrow">Nächster Schritt</p><h2>${state.wishDone?'Vielen Dank für Ihre Rückmeldung':'Ihr Fortbildungswunsch'}</h2><div class="task">${badge(state.wishDone?'Ergänzt':'Rückmeldung offen')}<h3 class="mt">Gesprächsführung und Konfliktklärung</h3><p>${state.wishDone?'Ihre Ergänzung steht in diesem Entwurf zur fachlichen Prüfung bereit.':'Bitte ergänzen Sie die Begründung für Ihren Fortbildungswunsch.'}</p>${state.wishDone?'':btn('Begründung ergänzen','wish','secondary')}</div></section><section class="panel"><h2>Ihre persönliche Entwicklung</h2><p class="muted">Registrierungen, Lernangebote und Nachweise in einer Übersicht.</p>${link('Lernpfad öffnen','learning','textlink')}</section></div></div>`;else if(state.mytab==='Nachweise')body=`<section class="panel"><div class="panel-head"><h2>Meine Nachweise</h2></div><div class="tablewrap mobilecards"><table><thead><tr><th>Fortbildung</th><th>Datum</th><th>Modul</th><th>Aktion</th></tr></thead><tbody>${[['Grundlagen der Kommunikation','08.09.2026','Bildung'],['Funktionelles Training','03.09.2026','Sport']].map(d=>`<tr><td><strong>${d[0]}</strong></td><td data-label="Datum">${d[1]}</td><td data-label="Modul">${d[2]}</td><td><button class="textlink" data-action="certificate">${icon('file')}Nachweis ansehen</button></td></tr>`).join('')}</tbody></table></div></section>`;else if(state.mytab==='Fertigkeiten')body=`<section class="panel"><h2>Meine Fertigkeiten</h2><div class="event"><span class="quick-icon">${icon('shield')}</span><div class="event-main"><h3>Kommunikation und Gesprächsführung</h3><p>Modul Bildung · Gültig bis 08.09.2027</p></div>${badge('Gültig')}</div><div class="notice mt">${icon('help')}<span>Gültigkeitszeiträume und Zuweisungen folgen den Regeln des jeweiligen Moduls.</span></div></section>`;else body=`<section class="panel"><div class="panel-head"><h2>Meine ${state.mytab}</h2>${btn('Neu erfassen','need','secondary')}</div><div class="event"><span class="quick-icon">${icon('book')}</span><div class="event-main"><h3>Gesprächsführung und Konfliktklärung</h3><p>Bildung · Für das Fortbildungsjahr 2027</p></div>${badge(state.wishDone?'Ergänzt':'In Prüfung')}</div>${state.needs.map(n=>`<div class="event"><span class="quick-icon">${icon('file')}</span><div class="event-main"><h3>${esc(n)}</h3><p>Neue Bedarfsmeldung</p></div>${badge('Erfasst')}</div>`).join('')}<p class="muted small mt">Den Bearbeitungsstand und Rückmeldungen Ihrer zuständigen Stelle sehen Sie hier.</p></section>`;return pagehead('Mein iBMS','Guten Morgen, Maria. Hier finden Sie Ihre persönliche Fortbildungsübersicht.')+`<div class="grid four">${stat(state.registrations.filter(r=>r.status==='Gebucht').length,'Gebuchte Veranstaltungen','Ihre bestätigten Termine')}${stat(state.wishDone?0:1,'Offene Rückmeldungen','Von Ihnen zu ergänzen','amber')}${stat(2,'Nachweise','Für absolvierte Fortbildungen','green')}${stat(1,'Fertigkeiten','Aktuell gültig')}</div><nav class="tabs" aria-label="Mein iBMS Bereiche">${tabs.map(x=>`<button class="tab" data-action="mytab" data-tab="${x}" ${state.mytab===x?'aria-current="true"':''}>${x}</button>`).join('')}</nav>${body}`;}
function catalog(last=false){const filtered=courses.filter(c=>(!last||(c.seats>0&&c.seats<=5))&&(state.module==='Alle Module'||c.module===state.module)&&(state.type==='Alle Formate'||c.type===state.type)&&(c.title+' '+c.category).toLowerCase().includes(state.query.toLowerCase()));return pagehead(last?'Last Minute':'Gesamtangebot',last?'Kurzfristig verfügbare Plätze in Bildung, Einsatztraining und Sport.':'Fortbildungen finden, Details prüfen und die Teilnahme organisieren.')+`<form id="catalog-filter" class="filterbar"><div class="field search-field"><label for="catalog-q">Angebot oder Thema</label><input id="catalog-q" name="q" type="search" value="${esc(state.query)}" placeholder="z. B. Kommunikation"></div><div class="field"><label for="module">Modul</label><select id="module" name="module">${['Alle Module','Bildung','Einsatztraining','Sport'].map(x=>`<option ${state.module===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="format">Format</label><select id="format" name="type">${['Alle Formate','Präsenz','E-Learning'].map(x=>`<option ${state.type===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" type="submit">${icon('search')}Suchen</button></form><div class="sectionhead"><p class="muted small" role="status">${filtered.length} passende Angebote</p><button class="textlink" data-action="save-search">Suche merken</button></div>${filtered.length?`<div class="grid three">${filtered.map(courseCard).join('')}</div>`:`<div class="panel empty"><h2>Keine passenden Angebote</h2><p>Ändern Sie den Suchbegriff oder setzen Sie die Filter zurück.</p>${btn('Filter zurücksetzen','reset-filter','secondary')}</div>`}`;}
function courseDetail(id){const c=courses.find(x=>x.id===id);if(!c)return pagehead('Angebot nicht gefunden')+link('Zum Gesamtangebot','catalog');let reg=state.registrations.find(r=>r.course===c.id);return `<div class="breadcrumb"><a href="#catalog">Gesamtangebot</a>${icon('chevron')}<span>${c.module}</span></div>`+pagehead(c.title,c.desc)+`<div class="detailgrid"><section class="panel"><p class="eyebrow">${c.category}</p><h2>Worum es geht</h2><p>${c.desc}</p><h3 class="mt">Zielgruppe</h3><p class="muted">Mitarbeitende mit einem entsprechenden Fortbildungsbedarf im jeweiligen Zuständigkeitsbereich.</p><h3 class="mt">Inhalte und Lernziele</h3><ul class="support-list"><li>Fachliche Grundlagen auffrischen und einordnen</li><li>Typische Situationen aus dem Arbeitsalltag bearbeiten</li><li>Das Gelernte auf die eigene Aufgabe übertragen</li></ul><div class="notice mt">${icon('help')}<span>Dies ist ein Beispielangebot. Inhalte, Voraussetzungen und Genehmigungsregeln werden durch die verantwortliche Stelle gepflegt.</span></div></section><aside class="panel"><h2>Ihre Teilnahme</h2><dl class="factlist"><div><dt>Format</dt><dd>${c.type}</dd></div><div><dt>Beginn</dt><dd>${formatDate(c.date)}</dd></div><div><dt>Uhrzeit</dt><dd>${c.time}</dd></div><div><dt>Ort</dt><dd>${c.place}</dd></div><div><dt>Umfang</dt><dd>${c.duration}</dd></div><div><dt>Verfügbarkeit</dt><dd>${c.seats?c.seats+' freie Plätze':'Ausgebucht'}</dd></div></dl><div class="mt">${reg?`${badge(reg.status)}<p class="small muted mt">Für dieses Angebot liegt bereits eine Registrierung vor.</p><button class="btn" data-action="registration" data-id="${c.id}">Registrierung ansehen</button>`:c.seats?`<p class="small muted">${c.approval?'Ihre Anmeldung benötigt eine Freigabe durch die zuständige Stelle.':'Für dieses Beispielangebot ist keine Genehmigung erforderlich.'}</p><button class="btn" data-action="book" data-id="${c.id}">${c.approval?'Teilnahme anfragen':'Verbindlich buchen'}</button>`:`<p class="notice amber">Zurzeit sind keine Plätze verfügbar.</p>${btn('Bedarf melden','need','secondary')}`}</div></aside></div>`;}
function users(){if(state.role!=='admin')return restricted('Die Anwenderverwaltung gehört zur Ansicht BMS-Administrator.','admin');const rows=people.filter(p=>p.name.toLowerCase().includes(state.userquery.toLowerCase())&&(state.userstatus==='Alle Status'||p.status===state.userstatus)&&(state.usermodule==='Alle Module'||p.module===state.usermodule));return pagehead('Anwender verwalten','Konten und fachliche Berechtigungen für Nordrhein-Westfalen.',btn(icon('plus')+'Anwender anlegen','create-user'))+`<div class="grid four mb">${stat(people.length,'Anwender gesamt','Im Beispielbestand')}${stat(people.filter(p=>p.status==='Aktiv').length,'Aktive Konten','Zur Nutzung freigegeben','green')}${stat(people.filter(p=>p.status==='Gesperrt').length,'Gesperrte Konten','Zugang aktuell eingeschränkt','amber')}${stat(3,'Fachmodule','Bildung, Einsatztraining, Sport')}</div><section class="panel"><form id="user-filter" class="filterbar"><div class="field search-field"><label for="user-q">Anwender suchen</label><input id="user-q" type="search" name="q" value="${esc(state.userquery)}" placeholder="Name eingeben"></div><div class="field"><label for="user-module">Modul</label><select id="user-module" name="module">${['Alle Module','Bildung','Einsatztraining','Sport'].map(x=>`<option ${x===state.usermodule?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="user-status">Status</label><select id="user-status" name="status">${['Alle Status','Aktiv','Gesperrt'].map(x=>`<option ${x===state.userstatus?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn secondary">Filtern</button></form><div class="tablewrap mobilecards"><table><caption>Anwender im Zuständigkeitsbereich</caption><thead><tr><th>Name</th><th>Organisationseinheit</th><th>Rolle / Modul</th><th>Status</th><th><span class="hidesr">Aktion</span></th></tr></thead><tbody>${rows.map(p=>`<tr><td><div class="personcell"><span class="avatar">${esc(p.initials)}</span><strong>${esc(p.name)}</strong></div></td><td data-label="Organisationseinheit">${esc(p.oe)}</td><td data-label="Rolle / Modul">${esc(p.role)}<small style="display:block">${esc(p.module)}</small></td><td data-label="Status">${badge(p.status)}</td><td><button class="textlink" data-action="edit-user" data-id="${p.id}">Bearbeiten ${icon('chevron')}</button></td></tr>`).join('')}</tbody></table>${!rows.length?'<p class="empty">Keine Anwender für diese Filter gefunden.</p>':''}</div><div class="tablefoot"><span role="status">${rows.length} von ${people.length} Anwendern</span><span>Seite 1 von 1</span></div></section>`;}
function restricted(text,role){return pagehead('Ansicht wechseln',text)+`<section class="panel"><p>Wählen Sie für die Demonstration die passende Rolle. Der Wechsel simuliert eine andere Sicht und vergibt keine echten Berechtigungen.</p><button class="btn" data-action="switch-role" data-rolevalue="${role}">${roleNames[role]} ansehen</button></section>`;}
function report(){if(state.role==='learner')return restricted('Berichte stehen nur freigegebenen Funktionsrollen zur Verfügung.','report');const factor=state.oe==='Direktion Verkehr'?.4:1;const rows=[['Einsatztaktik',800,640],['Eingriffstechniken',640,512],['Schießen',960,864]].map(([n,a,b])=>[n,Math.round(a*factor),Math.round(b*factor)]);const isExport=state.report==='Nachweise exportieren';return pagehead('Berichte & Statistiken','Auswertungen für Ihren fachlichen Zuständigkeitsbereich.')+`<div class="reportlayout"><nav class="panel reportnav" aria-label="Berichte">${['Fachaufsichtsreport ET',...(state.role==='admin'?['Nachweise exportieren']:[])].map(x=>`<button data-action="reporttype" data-type="${x}" ${state.report===x?'aria-current="true"':''}>${x}</button>`).join('')}</nav><div><section class="panel"><h2>${state.report}</h2><form id="report-filter" class="filterbar"><div class="field"><label for="report-oe">Organisationseinheit</label><select id="report-oe" name="oe">${['Alle zugewiesenen OE','Direktion Verkehr'].map(x=>`<option ${state.oe===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="report-year">Auswertejahr</label><select id="report-year" name="year"><option ${state.year==='2026'?'selected':''}>2026</option><option ${state.year==='2027'?'selected':''}>2027</option></select></div><button class="btn" type="submit">Auswerten</button></form><div class="notice">${icon('shield')}<span>${isExport?'Nachweisexporte werden als Auftrag angelegt und später zum Download bereitgestellt.':'Diese Fachaufsichtssicht zeigt statistische Daten. Personenbezogene Detailansichten sind hier nicht verfügbar.'}</span></div></section>${isExport?`<section class="panel mt"><h2>Meine Exportaufträge</h2><p class="muted">Modul Bildung · Zeitraum ${state.year} · ${esc(state.oe)}</p>${btn('Nachweisexport anfordern','export-job')}<div class="mt">${state.exportJobs.length?state.exportJobs.map((j,i)=>`<div class="event"><div class="event-main"><h3>Nachweisexport ${i+1}</h3><p>${esc(j)}</p></div>${badge('Eingeplant')}</div>`).join(''):'<p class="small muted">Noch keine Exportaufträge vorhanden.</p>'}</div></section>`:state.year==='2027'?'<section class="panel empty mt"><h2>Noch keine Trainingsdaten</h2><p>Für 2027 liegen in diesem Beispielbestand keine erfassten Trainingsstunden vor.</p></section>':`<section class="panel mt"><div class="panel-head"><h2>Trainingsstunden im Überblick</h2>${badge(state.year)}</div><p class="small muted">${esc(state.oe)} · Soll und statistisch gekapptes Ist</p><div class="chart" role="img" aria-label="Trainingsstunden. Die vollständigen Werte stehen in der anschließenden Datentabelle.">${rows.map(([n,a,b])=>`<div class="chartrow"><span>${n}</span><div class="barpair"><div class="bar" style="width:${a/(960*factor)*100}%"></div><div class="bar ist" style="width:${b/(960*factor)*100}%"></div></div><strong>${b} h</strong></div>`).join('')}</div><div class="chartlegend"><span><i></i>Soll</span><span><i class="blue"></i>Ist</span></div><div class="tablewrap mt"><table><caption>Trainingsstunden als Datentabelle</caption><thead><tr><th>Fachbereich</th><th>Soll</th><th>Ist</th><th>Erfüllung</th></tr></thead><tbody>${rows.map(([n,a,b])=>`<tr><td>${n}</td><td>${a} h</td><td>${b} h</td><td>${Math.round(b/a*100)} %</td></tr>`).join('')}</tbody></table></div><button class="textlink mt" data-action="csv">${icon('download')}Beispieldaten als CSV</button></section>`}</div></div>`;}
function learning(){const steps=[['Grundlagen','Nachweis vorhanden'],['Wissen vertiefen','E-Learning gebucht'],['In der Praxis anwenden','Präsenztermin gebucht']];const details=[{title:'Grundlagen der Kommunikation',text:'Ihre Teilnahme ist abgeschlossen. Der Nachweis ist in Mein iBMS hinterlegt.',tag:'Abgeschlossen',action:'Nachweis ansehen',act:'certificate'},{title:'Datenschutz im Polizeialltag',text:'Öffnen Sie die zugehörige Lernmaßnahme im angebundenen Lernmanagementsystem.',tag:'Gebucht',action:'E-Learning starten',act:'lms'},{title:'Deeskalation in der Praxis',text:'Ihre Präsenzveranstaltung ist gebucht. Prüfen Sie die Veranstaltungsdetails und organisatorischen Hinweise.',tag:'Gebucht',action:'Veranstaltungsdetails',act:'path-event'}];let d=details[state.lesson];return pagehead('Mein Lernpfad','Ihre Fortbildung Schritt für Schritt.')+`<div class="learning-banner"><p class="eyebrow">Kommunikation & Handlungskompetenz</p><h2>Deeskalation im Einsatz</h2><p>Persönliche Übersicht zu Ihren Fortbildungsangeboten</p></div><div class="pathlayout"><nav class="panel pathnav" aria-label="Schritte im Lernpfad"><h3>Ihr Weg im Überblick</h3><p class="small muted">1 von 3 Schritten abgeschlossen</p><div class="progress" role="progressbar" aria-valuenow="1" aria-valuemin="0" aria-valuemax="3" aria-label="Abgeschlossene Schritte"><span style="width:33.33%"></span></div>${steps.map(([h,n],i)=>`<button class="pathstep ${i===0?'done':''} ${state.lesson===i?'active':''}" data-action="lesson" data-id="${i}" ${state.lesson===i?'aria-current="step"':''}><strong>${i===0?'✓':i+1+'.'} ${h}</strong><small>${n}</small></button>`).join('')}</nav><section class="panel"><div class="panel-head"><p class="eyebrow" style="margin:0">Schritt ${state.lesson+1} von 3</p>${badge(d.tag)}</div><h2 style="font-size:2rem">${d.title}</h2><p class="muted">${d.text}</p><div class="lesson"><span class="stepnumber ${state.lesson===0?'done':''}">${icon(state.lesson===0?'check':'book')}</span><div><h3>${state.lesson===0?'Ihr Nachweis':state.lesson===1?'Lernen im angeschlossenen LMS':'Ihr Präsenztermin'}</h3><p>${state.lesson===0?'Abgeschlossen am 08.09.2026 · Modul Bildung':state.lesson===1?'90 Minuten · Zeitlich flexibel · Registrierung bestätigt':'15.10.2026 · 09:00–16:00 Uhr · Fortbildungszentrum NRW'}</p><button class="btn" data-action="${d.act}">${d.action}${icon('arrow')}</button></div></div><h3 class="mt">Ihre Unterlagen</h3><button class="textlink" data-action="path-info">${icon('file')}Organisatorische Hinweise</button></section></div><p class="small muted mt">Gestaltungsvorschlag: Der Lernpfad bündelt Registrierungen, LMS-Einstiege und Nachweise. Er ist kein zusätzlich zugesagtes LMS-Modul.</p>`;}
function article(){return `<div class="breadcrumb"><a href="#home">Startseite</a>${icon('chevron')}<span>Aktuelles</span></div><div class="article-cover" role="img" aria-label="Abstraktes Bildmotiv der Wissensplattform"></div><div class="articletext"><p class="eyebrow">Fortbildungsplanung · Beispielbeitrag</p>${pagehead('Fortbildung gemeinsam gestalten','16. September 2026 · Fortbildungsorganisation')}<p>Welche Kompetenzen möchten Sie vertiefen? Ihre Bedarfsmeldungen helfen der zuständigen Stelle, das Fortbildungsangebot zu planen.</p><h2>Bedarf melden</h2><p>In Mein iBMS können Sie einen Bedarf zu einem bestehenden Angebot erfassen und dessen Bearbeitungsstand verfolgen. Nutzen Sie für einen individuellen Wunsch den Bereich Fortbildungswünsche.</p><h2>Was danach passiert</h2><p>Ihre zuständige Stelle prüft die Meldung. Rückmeldungen und Statusänderungen erscheinen in Ihrer persönlichen Übersicht.</p>${link('Zu Mein iBMS','dashboard')}</div>`;}
function help(){return pagehead('Hilfe & Kontakt','Antworten für Ihren nächsten Schritt.')+`<div class="grid two"><section class="panel"><h2>Häufige Fragen</h2>${[['Wie melde ich mich zu einer Veranstaltung an?','Öffnen Sie das Gesamtangebot, wählen Sie eine Veranstaltung und prüfen Sie die Details. Je nach Regelung können Sie direkt buchen oder eine Teilnahme anfragen.'],['Wo finde ich meine Nachweise?','Öffnen Sie Mein iBMS und wählen Sie Nachweise. Dort finden Sie Ihre dokumentierten Teilnahmen.'],['Warum sehe ich nicht alle Verwaltungsfunktionen?','Die Oberfläche richtet sich nach Ihrer fachlichen Rolle und Ihrem Zuständigkeitsbereich. In diesem Entwurf können Sie über „Ansicht im Clickdummy“ weitere Rollen demonstrieren.'],['Wo bearbeite ich meine E-Learning-Inhalte?','iBMS öffnet die zugehörige Lernmaßnahme im angebundenen LMS. Die Bearbeitung der Lerninhalte erfolgt dort.']].map(([q,a])=>`<details class="faq"><summary>${q}</summary><p>${a}</p></details>`).join('')}</section><aside class="panel"><h2>Ihre Ansprechstelle</h2><p class="muted">Bei fachlichen Fragen wenden Sie sich an Ihre zuständige Fortbildungsstelle. Für technische Anliegen steht Ihnen der lokale Support zur Verfügung.</p>${btn('Kontaktanfrage vorbereiten','contact','secondary')}<div class="notice mt">${icon('help')}<span>Im Clickdummy werden keine Nachrichten versendet.</span></div></aside></div>`;}
function render(focus=true){let r=location.hash.slice(1)||'login';const route=r.split('/')[0];let content;switch(route){case'login':$('#app').innerHTML=login();break;case'home':content=home();break;case'dashboard':content=dashboard();break;case'catalog':content=catalog();break;case'lastminute':content=catalog(true);break;case'course':content=courseDetail(Number(r.split('/')[1]));break;case'users':content=users();break;case'report':content=report();break;case'learning':content=learning();break;case'article':content=article();break;case'help':content=help();break;default:content=pagehead('Diese Seite ist nicht verfügbar')+link('Zur Startseite','home');}if(content!==undefined)$('#app').innerHTML=layout(content,route);document.title=($('#page-title')?.textContent||'iBMS 3.0')+' · POLIZEI-ONLINE';if(focus){window.scrollTo(0,0);$('#page-title')?.focus({preventScroll:true});}}
function toast(text){const e=$('#toast');e.textContent=text;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),5500);}
function modal(title,body,cls=''){const d=$('#dialog');if(!d.open)opener=document.activeElement;d.className=cls;$('#dialog-content').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="iconbtn" data-action="close" aria-label="Dialog schließen">${icon('close')}</button></div><div class="dialog-body">${body}</div>`;if(!d.open)d.showModal();}
function close(){const d=$('#dialog');if(d.open)d.close();if(opener?.isConnected)opener.focus();}
function registration(id){const reg=state.registrations.find(x=>x.course===id);const c=courses.find(x=>x.id===id);if(!reg||!c)return;modal('Ihre Registrierung',`<p class="eyebrow">${c.module}</p><h3>${c.title}</h3>${badge(reg.status)}<dl class="factlist mt"><div><dt>Datum</dt><dd>${formatDate(c.date)}</dd></div><div><dt>Ort</dt><dd>${c.place}</dd></div><div><dt>Teilnehmende Person</dt><dd>Maria Beispiel</dd></div></dl><h3 class="mt">Historie</h3><p class="small muted">Registrierung erfasst. ${reg.status==='Gebucht'?'Teilnahme bestätigt.':'Freigabe durch zuständige Stelle ausstehend.'}</p><div class="dialog-actions">${c.type==='E-Learning'&&reg.status==='Gebucht'?btn('E-Learning starten','lms'):''}${reg.status==='Angemeldet'?`<button class="btn secondary" data-action="withdraw" data-id="${c.id}">Anmeldung widerrufen</button>`:''}${btn('Schließen','close','secondary')}</div>`);}
function editUser(id){let p=people.find(x=>x.id===id);if(!p)return;modal('Anwender bearbeiten',`<form id="edit-user" data-id="${p.id}"><p class="eyebrow">Nordrhein-Westfalen / Fachliche Berechtigung</p><h3>${esc(p.name)}</h3><div class="field"><label for="edit-module">Modul</label><select id="edit-module" name="module">${['Bildung','Einsatztraining','Sport'].map(x=>`<option ${x===p.module?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="edit-role">Funktionsrolle</label><select id="edit-role" name="role">${roleOptions(p.module,p.role)}</select></div><div class="field"><label for="edit-oe">Zuständige Organisationseinheit</label><select id="edit-oe" name="oe">${[...new Set(people.map(x=>x.oe))].map(x=>`<option ${p.oe===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label for="edit-status">Kontostatus</label><select id="edit-status" name="status"><option ${p.status==='Aktiv'?'selected':''}>Aktiv</option><option ${p.status==='Gesperrt'?'selected':''}>Gesperrt</option></select></div><p class="small muted">Änderungen gelten nur für den Beispielbestand dieses Clickdummys.</p><div class="dialog-actions">${btn('Abbrechen','close','secondary')}<button class="btn" type="submit">Änderungen prüfen</button></div></form>`);}
function roleOptions(module,selected){return (module==='Bildung'?['Anwender','SbDA','SbAuF']:module==='Einsatztraining'?['Anwender','ET-Trainer','ET-Administrator']:['Anwender','Sport-Beauftragter','Sport-Koordinator']).map(x=>`<option ${x===selected?'selected':''}>${x}</option>`).join('');}
let pendingUser=null;
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action,id=Number(a.dataset.id);switch(action){case'close':close();break;case'menu':modal('Menü',`<nav class="menu-links" aria-label="Mobile Navigation">${navItems().map(([r,n,i])=>`<a href="#${r}" ${location.hash==='#'+r?'aria-current="page"':''}>${icon(i)}${n}</a>`).join('')}<a href="#help">${icon('help')}Hilfe & Kontakt</a><a href="#login">${icon('logout')}Abmelden</a></nav><div class="rolebox">${roleSelect('mobile-role')}</div><p class="small mt">Interaktiver Entwurf · Beispieldaten</p>`,'mobile-nav-dialog');break;case'notifications':modal('Benachrichtigungen',`<div class="newsrow"><span class="quick-icon">${icon('calendar')}</span><div><h3>Teilnahme bestätigt</h3><p>Deeskalation im Einsatz · 15.10.2026</p><a class="textlink" href="#dashboard">Meine Registrierungen öffnen</a></div></div><div class="newsrow"><span class="quick-icon">${icon('file')}</span><div><h3>Nachweis verfügbar</h3><p>Grundlagen der Kommunikation</p><button class="textlink" data-action="certificate">Nachweis ansehen</button></div></div>`);break;case'profile':modal('Ihr Profil',`<h3>Maria Beispiel</h3><dl class="factlist"><div><dt>Organisation</dt><dd>Polizei NRW</dd></div><div><dt>Organisationseinheit</dt><dd>Direktion Zentrale Aufgaben</dd></div><div><dt>Demoansicht</dt><dd>${roleNames[state.role]}</dd></div></dl><div class="dialog-actions"><a class="btn secondary" href="#login">Abmelden</a></div>`);break;case'search':modal('Angebote suchen',`<form id="modal-search"><div class="field"><label for="modal-q">Angebot oder Thema</label><input id="modal-q" name="q" type="search" placeholder="z. B. Deeskalation" autofocus></div><button class="btn" type="submit">Gesamtangebot durchsuchen</button></form>`);break;case'mytab':state.mytab=a.dataset.tab;render(false);document.querySelector(`[data-tab="${state.mytab}"]`)?.focus();break;case'reset-filter':state.query='';state.module='Alle Module';state.type='Alle Formate';render();break;case'save-search':state.favorites.push({q:state.query,module:state.module,type:state.type});toast('Ihre Suchauswahl wurde für diese Demonstration gemerkt.');break;case'registration':registration(id);break;case'book':{let c=courses.find(x=>x.id===id);modal(c.approval?'Teilnahme anfragen':'Teilnahme buchen',`<form id="book-form" data-id="${c.id}"><h3>${c.title}</h3><p class="muted">${formatDate(c.date)} · ${c.time}</p><div class="field"><label for="book-note">Bemerkung an die zuständige Stelle (optional)</label><textarea id="book-note" name="note"></textarea></div><label class="checkline"><input type="checkbox" required><span>Ich habe die Veranstaltungsdetails und Teilnahmevoraussetzungen gelesen.</span></label><p class="small muted">${c.approval?'Die Anfrage wartet anschließend auf fachliche Freigabe.':'Ihre Teilnahme wird im Beispielbestand direkt gebucht.'}</p><div class="dialog-actions">${btn('Abbrechen','close','secondary')}<button class="btn">${c.approval?'Anfrage absenden':'Buchung bestätigen'}</button></div></form>`);break;}case'withdraw':modal('Anmeldung widerrufen?',`<p>Sie können diese noch unbearbeitete Anmeldung zurücknehmen.</p><div class="dialog-actions">${btn('Abbrechen','close','secondary')}<button class="btn" data-action="confirm-withdraw" data-id="${id}">Widerruf bestätigen</button></div>`);break;case'confirm-withdraw':state.registrations=state.registrations.filter(r=>r.course!==id);close();render(false);toast('Anmeldung im Beispielbestand widerrufen.');break;case'lesson':state.lesson=id;render(false);document.querySelector(`[data-action="lesson"][data-id="${id}"]`)?.focus();break;case'lms':modal('Übergang zur Lernplattform',`<p>In der Anwendung öffnet sich hier die zugehörige Lernmaßnahme im angebundenen LMS.</p><div class="notice">${icon('monitor')}<span>Datenschutz im Polizeialltag<br><strong>Externe Lernmaßnahme</strong></span></div><p class="small muted mt">Der Clickdummy ist mit keinem LMS verbunden und übermittelt keine Daten. Lerninhalte und Bearbeitungsfortschritt entstehen im LMS.</p>${btn('Zurück zu iBMS','close','secondary')}`);break;case'certificate':modal('Fortbildungsnachweis',`<p class="eyebrow">Beispielnachweis</p><h3>Grundlagen der Kommunikation</h3><dl class="factlist"><div><dt>Teilnehmende Person</dt><dd>Maria Beispiel</dd></div><div><dt>Modul</dt><dd>Bildung</dd></div><div><dt>Teilnahmedatum</dt><dd>08.09.2026</dd></div><div><dt>Status</dt><dd>Abgeschlossen</dd></div></dl><p class="small muted mt">Fiktiver Nachweis zur Demonstration. Kein gültiger Fortbildungsnachweis.</p>${btn('Schließen','close','secondary')}`);break;case'path-event':location.hash='course/1';break;case'path-info':modal('Organisatorische Hinweise',`<h3>Deeskalation im Einsatz</h3><p>Bitte prüfen Sie vor dem Termin die Veranstaltungsdetails und die Hinweise Ihrer Fortbildungsstelle.</p><p class="muted">Beispieltermin: 15.10.2026, 09:00–16:00 Uhr.</p>${btn('Schließen','close','secondary')}`);break;case'wish':modal('Begründung ergänzen',`<form id="wish-form"><h3>Gesprächsführung und Konfliktklärung</h3><div class="field"><label for="wish-note">Begründung Ihres Fortbildungswunsches</label><textarea id="wish-note" required minlength="10" placeholder="Welche Kenntnisse möchten Sie vertiefen?"></textarea><span class="hint">Bitte mindestens 10 Zeichen eingeben.</span></div><div class="dialog-actions">${btn('Abbrechen','close','secondary')}<button class="btn">Ergänzung speichern</button></div></form>`);break;case'need':modal('Fortbildungsbedarf erfassen',`<form id="need-form"><div class="field"><label for="need-title">Thema oder Angebot</label><input id="need-title" required name="title"></div><div class="field"><label for="need-text">Fachliche Begründung</label><textarea id="need-text" required minlength="10"></textarea></div><p class="small muted">Die Meldung wird ausschließlich in dieser Demonstration erfasst.</p><div class="dialog-actions">${btn('Abbrechen','close','secondary')}<button class="btn">Bedarf erfassen</button></div></form>`);break;case'edit-user':if(state.role==='admin')editUser(id);break;case'confirm-user':if(pendingUser&&state.role==='admin'){Object.assign(people.find(x=>x.id===pendingUser.id),pendingUser);pendingUser=null;close();render(false);toast('Berechtigungen im Beispielbestand aktualisiert.');}break;case'create-user':if(state.role==='admin')modal('Anwender anlegen',`<form id="create-user"><p class="small muted">Manuelle Anlage ist in diesem Demonstrationsszenario freigegeben.</p><div class="field"><label for="new-name">Vor- und Nachname</label><input id="new-name" name="name" required minlength="3"></div><div class="field"><label for="new-oe">Organisationseinheit</label><select id="new-oe" name="oe">${[...new Set(people.map(x=>x.oe))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><p class="notice">Das neue Beispielkonto erhält zunächst die Rolle Anwender im Modul Bildung.</p><div class="dialog-actions">${btn('Abbrechen','close','secondary')}<button class="btn">Beispielkonto anlegen</button></div></form>`);break;case'switch-role':state.role=a.dataset.rolevalue;state.report='Fachaufsichtsreport ET';render();break;case'reporttype':state.report=a.dataset.type;render(false);break;case'csv':downloadCSV();break;case'export-job':state.exportJobs.push(state.year+' · '+state.oe);render(false);toast('Exportauftrag eingeplant. Die Bereitstellung über Nacht wird im Dummy nicht ausgeführt.');break;case'accessibility':modal('Barrierefreiheit',`<p>Der Entwurf berücksichtigt semantische Bereiche, sichtbaren Tastaturfokus, beschriftete Formulare, Statusangaben in Textform und responsive Ansichten.</p><ul class="support-list"><li>Mit Tabulator zwischen Bedienelementen wechseln</li><li>Mit Escape Dialoge und das mobile Menü schließen</li><li>Diagrammwerte auch als Tabelle lesen</li><li>Vergrößerung und reduzierte Bewegung berücksichtigen</li></ul><p class="notice">Dies ist ein Gestaltungskonzept. Eine verbindliche BITV-NRW-Prüfung und Prüfung mit assistiven Technologien erfolgt an der implementierten Anwendung.</p>`);break;case'privacy':modal('Datenschutz im Entwurf',`<p>Alle Personen, Termine und Kennzahlen sind Beispieldaten. Es gibt keine echte Anmeldung, keine Backend-Anbindung und keinen Versand von Nachrichten.</p><p>Änderungen bestehen nur während der aktuellen Sitzung im Arbeitsspeicher des Browsers. Beim Neuladen wird der Beispielbestand zurückgesetzt.</p><p class="small muted">Diese Information ist keine Datenschutzerklärung für das spätere Produktivsystem.</p>`);break;case'about':modal('Über diesen Gestaltungsentwurf',`<p><strong>Fachliche Grundlage:</strong> Leistungsbeschreibung und Funktionsbeschreibung iBMS 3.0, Vergabenummer ZA 4.2/1002001550/LS.</p><p><strong>Designbasis:</strong> die gelieferten VITA- und Wissensplattform-SVGs sowie Distart-Beispiele. Das originale abstrakte Bildmotiv, der Rahmen, die Serif-/Sans-Kombination und die mobilen Kompositionen werden auf LZPD NRW übertragen.</p><p>Login: FB S. 20–21. Mein iBMS: S. 21–30. Anwenderverwaltung: S. 45–49. Reports: S. 61–65. Responsivität und Barrierefreiheit: LB S. 6–8.</p><p>Der Lernpfad ist ein Gestaltungsvorschlag zur Zusammenführung vorhandener Fachobjekte. Kein zusätzlicher Leistungsumfang oder Produktivbetrieb.</p>`);break;case'help-login':modal('Hilfe zur Anmeldung',`<p>Für den Entwurf benötigen Sie kein Passwort. „Mit Behördenkonto anmelden“ öffnet die Beispielansicht.</p><p>Im Produktivsystem richtet sich die Anmeldung nach der Konfiguration des Kooperationspartners. SSO und Mehrfaktor-Authentisierung werden dort angebunden.</p>`);break;case'contact':modal('Kontaktanfrage vorbereiten',`<form id="contact-form"><div class="field"><label for="contact-topic">Anliegen</label><select id="contact-topic"><option>Fachliche Frage</option><option>Technisches Problem</option><option>Barriere melden</option></select></div><div class="field"><label for="contact-message">Ihre Nachricht</label><textarea id="contact-message" required minlength="10"></textarea></div><p class="small muted">Es erfolgt kein Versand. Bitte keine echten personenbezogenen Daten eingeben.</p><button class="btn">Vorschau anzeigen</button></form>`);break;}});
document.addEventListener('change',e=>{if(e.target.matches('[data-role]')){state.role=e.target.value;state.report='Fachaufsichtsreport ET';close();if(['#users','#report'].includes(location.hash)){location.hash=state.role==='admin'?'users':state.role==='report'?'report':'dashboard';}else render(false);toast('Demoansicht gewechselt: '+roleNames[state.role]);}if(e.target.id==='edit-module')$('#edit-role').innerHTML=roleOptions(e.target.value,'Anwender');});
document.addEventListener('submit',e=>{const f=e.target;if(!f.id)return;e.preventDefault();if(!f.reportValidity())return;const d=new FormData(f);switch(f.id){case'home-search':case'modal-search':state.query=String(d.get('q')||'');close();if(location.hash==='#catalog')render(false);else location.hash='catalog';break;case'catalog-filter':state.query=String(d.get('q'));state.module=String(d.get('module'));state.type=String(d.get('type'));render(false);$('#catalog-q')?.focus();toast('Suchergebnisse aktualisiert.');break;case'user-filter':state.userquery=String(d.get('q'));state.usermodule=String(d.get('module'));state.userstatus=String(d.get('status'));render(false);$('#user-q')?.focus();toast('Anwenderliste gefiltert.');break;case'report-filter':state.oe=String(d.get('oe'));state.year=String(d.get('year'));render(false);$('#report-oe')?.focus();toast('Auswertung aktualisiert.');break;case'book-form':{const id=Number(f.dataset.id),c=courses.find(x=>x.id===id);if(!state.registrations.some(r=>r.course===id)){state.registrations.push({course:id,status:c.approval?'Angemeldet':'Gebucht'});}close();state.mytab='Registrierungen';location.hash='dashboard';toast(c.approval?'Teilnahme angefragt. Freigabe steht aus.':'Teilnahme im Beispielbestand gebucht.');break;}case'wish-form':state.wishDone=true;close();render(false);toast('Ihre Ergänzung wurde im Entwurf gespeichert.');break;case'need-form':{let title=String(d.get('title'));state.needs.push(title);state.mytab='Bedarfsmeldungen';close();if(location.hash==='#dashboard')render(false);else location.hash='dashboard';toast('Beispielbedarf „'+title+'“ erfasst.');break;}case'edit-user':pendingUser={id:Number(f.dataset.id),module:String(d.get('module')),role:String(d.get('role')),oe:String(d.get('oe')),status:String(d.get('status'))};modal('Änderung prüfen',`<p>Bitte prüfen Sie die neue Zuordnung für <strong>${esc(people.find(x=>x.id===pendingUser.id).name)}</strong>.</p><dl class="factlist"><div><dt>Modul</dt><dd>${esc(pendingUser.module)}</dd></div><div><dt>Rolle</dt><dd>${esc(pendingUser.role)}</dd></div><div><dt>Zuständigkeit</dt><dd>${esc(pendingUser.oe)}</dd></div><div><dt>Status</dt><dd>${esc(pendingUser.status)}</dd></div></dl><div class="dialog-actions">${btn('Abbrechen','close','secondary')}${btn('Änderung bestätigen','confirm-user')}</div>`);break;case'create-user':{const name=String(d.get('name')).trim();people.push({id:Math.max(...people.map(x=>x.id))+1,name,initials:name.split(' ').map(x=>x[0]).slice(0,2).join(''),oe:String(d.get('oe')),role:'Anwender',module:'Bildung',status:'Aktiv'});close();render(false);toast('Beispielkonto angelegt.');break;}case'contact-form':modal('Vorschau Ihrer Anfrage',`<p class="eyebrow">${esc($('#contact-topic').value)}</p><p style="white-space:pre-wrap">${esc($('#contact-message').value)}</p><div class="notice">Die Nachricht wurde nicht versendet.</div>${btn('Schließen','close','secondary')}`);break;}});
function downloadCSV(){let factor=state.oe==='Direktion Verkehr'?.4:1;let text='Beispieldaten iBMS 3.0\r\nFachbereich;Soll (h);Ist (h)\r\n'+[['Einsatztaktik',800,640],['Eingriffstechniken',640,512],['Schießen',960,864]].map(([n,a,b])=>[n,Math.round(a*factor),Math.round(b*factor)].join(';')).join('\r\n');let url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='iBMS_Beispielreport.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV mit Beispieldaten erstellt.');}
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]')&&$('#dialog').open)close();});$('#dialog').addEventListener('close',()=>{if(opener?.isConnected)opener.focus();});window.addEventListener('hashchange',()=>{close();render();});render(false);
</script></body></html>
