<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ebecf0" />
    <meta
      name="description"
      content="iBMS 3.0 – interaktiver Gestaltungsentwurf für POLIZEI-ONLINE der Polizei NRW."
    />
    <title>iBMS 3.0 · POLIZEI-ONLINE</title>

    <!-- Installable app: manifest, iOS standalone hints, home-screen icon. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent, not default: `default` makes iOS reserve the status
         bar strip and paint it with the theme colour, so the web view starts
         below the notch and the glass bar can never reach the top edge. This
         puts the view under the status bar, where `viewport-fit=cover` gives
         the safe-area insets the chrome already pads itself with. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="iBMS 3.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint: a cold start on a phone
         waited on Google's stylesheet before it drew anything, which is the
         white screen an installed app opens with. `display=swap` in the URL
         means the text is laid out in the system font and re-drawn in Inter
         the moment the webfont arrives. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@700&display=swap"
      />
    </noscript>

    <link rel="stylesheet" href="css/01-tokens.css" />
    <link rel="stylesheet" href="css/02-base.css" />
    <link rel="stylesheet" href="css/03-layout.css" />
    <link rel="stylesheet" href="css/04-components.css" />
    <link rel="stylesheet" href="css/05-responsive.css" />
    <link rel="stylesheet" href="css/06-mobile.css" />
    <link rel="stylesheet" href="css/07-motion.css" />
  </head>
  <body>
    <a href="#main" class="skip">Zum Hauptinhalt springen</a>
    <div id="app"></div>
    <!-- The phone tab bar lives outside #app so it survives a re-render and
         can animate the selection between routes. -->
    <div id="tabbar-root"></div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/01-icons.js"></script>
    <script src="js/02-data.js"></script>
    <script src="js/03-state.js"></script>
    <script src="js/04-ui.js"></script>
    <script src="js/05-chrome.js"></script>
    <script src="js/06-views.js"></script>
    <script src="js/07-render.js"></script>
    <script src="js/08-haptics.js"></script>
    <script src="js/09-actions.js"></script>

    <script>
      // Registered from the page so the scope follows wherever the app is
      // served from (project root locally, /LZPD-NRW/ on GitHub Pages).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
